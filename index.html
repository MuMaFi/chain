<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff;
  --line:#000000;
  --text:#000000;
  --sub:#666666;
  --hover:#f0f0f0;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;min-width:0}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden}
body{min-height:100vh;padding:max(40px,env(safe-area-inset-top)) 16px max(80px,env(safe-area-inset-bottom));overscroll-behavior:none}
.wrap{max-width:720px;margin:0 auto}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

header{margin-bottom:36px;display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:8px}
h1{font-size:1.5rem;letter-spacing:1px;margin:0;font-weight:600;color:var(--text);text-transform:lowercase}
h1 .brand-by{font-size:.62rem;letter-spacing:.04em;font-weight:500;color:var(--sub);margin-left:8px;text-transform:none}

section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin-bottom:18px;animation:fadeIn .4s cubic-bezier(.2,.8,.2,1) both}
section h2{font-size:.8rem;text-transform:uppercase;letter-spacing:1px;color:var(--text);margin:0 0 18px;font-weight:600;display:flex;align-items:center;gap:8px}
section h2::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--text);flex-shrink:0}
section h2 .btn{margin-left:auto}

/* Dials */
.top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr) minmax(0,1fr);gap:clamp(4px,1.5vw,12px);align-items:start}
.kw{text-align:center}
.kw label{display:block;font:600 clamp(10px,2.6vw,12px) 'IBM Plex Mono',monospace;margin-top:2px;color:var(--text);text-transform:uppercase;letter-spacing:.08em}
.kw b{font-size:.85rem;font-weight:600;color:var(--text)}
.dial{position:relative;padding:16%}
.dial em{position:absolute;font:500 clamp(6px,1.8vw,9px) 'IBM Plex Mono',monospace;font-style:normal;color:var(--sub);transform:translate(-50%,-50%)}
.ring{width:100%;aspect-ratio:1;border-radius:50%;padding:9%;touch-action:none;cursor:ns-resize;border:1px solid var(--line);background:#fff}
.knob{width:100%;height:100%;border-radius:50%;position:relative;background:#fff;border:1px solid var(--line);transition:background .15s}
.ring:hover .knob{background:var(--hover)}
.knob i{position:absolute;inset:0;pointer-events:none}
.knob i::before{content:'';position:absolute;left:calc(50% - 1px);top:6%;width:2px;height:26%;background:#000;border-radius:1px}

.scr{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px;margin-top:6%}
.scr canvas{width:100%;height:clamp(64px,19vw,100px);display:block}
.adv{display:block;width:100%;margin-top:8px}

/* Buttons */
.btn{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 8px;font:600 .8rem 'IBM Plex Mono',monospace;letter-spacing:.01em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .12s,color .12s}
.btn:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn:disabled:hover{background:#fff}
.btn.on,.btn.pri{background:#000;color:#fff}
.btn.on:hover,.btn.pri:hover{background:#222}
.btn.pri:disabled:hover{background:#000}
.adv{font-size:clamp(10px,3vw,.8rem);padding:clamp(7px,2.2vw,11px) 4px}

.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line .btn{flex:1;white-space:nowrap;font-size:clamp(10px,3vw,.8rem);padding-left:4px;padding-right:4px}
.bpm{flex:2 1 100%;order:5;display:flex;align-items:center;gap:12px;font-size:.78rem;margin-top:4px}
.bpm input{flex:1;accent-color:#000}
.bpm b{color:var(--text);font-size:.85rem;font-weight:600;white-space:nowrap;min-width:64px}
input[type=file]{display:none}

/* Pedalboard */
.rack{background:#fff}
.pads{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;justify-items:center}.pads .pad{width:100%}
@media(min-width:560px){.pads{grid-template-columns:repeat(8,minmax(0,1fr))}}
.pad{position:relative;aspect-ratio:1;padding:4px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--text);font:600 clamp(7.5px,2.1vw,10px)/1.15 'IBM Plex Mono',monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;white-space:normal;transition:transform .15s,background .15s}
.pad:hover{transform:translateY(-2px);background:var(--hover)}
.pad.on{background:#000;color:#fff}
.pad::after{content:attr(data-n);position:absolute;top:13%;right:17%;font-size:8px;opacity:.85}
.pad.focus{outline:1px solid #000;outline-offset:3px}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1)}
.fold.open{grid-template-rows:1fr}
.fold>div{overflow:hidden}
.lv{display:flex;gap:8px;align-items:center;padding-top:12px}
.lv span{flex:1.3;font-size:.72rem;font-weight:600;letter-spacing:1px;color:var(--text);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .btn{flex:1;padding:9px 2px;font-size:clamp(9px,2.6vw,11px)}

/* Generate */
.bot{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px}
.msg{background:#fff;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;min-height:68px;cursor:pointer;font-family:inherit;color:var(--text);transition:transform .15s,background .15s}
.msg:hover{transform:translateY(-2px);background:var(--hover)}
.msg b{font:600 clamp(11px,3.4vw,15px)/1.2 'IBM Plex Mono',monospace;color:var(--text);text-transform:uppercase;text-align:center}
.msg small{font-size:.68rem;color:var(--sub);text-align:center;max-width:100%;white-space:normal;line-height:1.35}
#gen{background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;font:600 clamp(13px,4vw,16px) 'IBM Plex Mono',monospace;cursor:pointer;transition:transform .12s,background .12s}
#gen:disabled{opacity:.4;cursor:not-allowed}
#gen.ready{background:#000;color:#fff}
#gen.ready:hover{background:#222}
#gen:active{transform:translateY(1px)}
.result{margin-top:12px}

.foot{text-align:center;font-size:.7rem;letter-spacing:.04em;color:var(--sub);margin-top:28px}

.mgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding-top:2px}
.cell{aspect-ratio:1.3;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.cell.on{background:#000}
.mrow{display:flex;gap:8px;padding-top:8px}
.mrow .btn{flex:1;padding:9px 2px;font-size:11px}
@media(max-width:480px){section{padding:18px 14px}}
</style></head><body>
<div class="wrap">
<header><h1>spule<span class="brand-dot">.</span><span class="brand-by">lofi loop machine</span></h1></header>

 <div class="kw"><div class="dial" id="dU"><div class="ring" id="kUnstable"><div class="knob"><i></i></div></div></div><label>Unstable</label><b>0</b></div>

<section>
<h2>Pedalboard<button class="btn" id="mel" style="padding:7px 12px;font-size:.7rem">♪ Melodie-Modus</button></h2>
<div class="rack"><div class="pads m" id="pads"></div>
 <div class="fold" id="xf"><div><div class="pads" id="xpads" style="padding-top:8px"></div></div></div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
let audioCtx=null,originalBuffer=null,processedBuffer=null,sourceNode=null,playing=null,currentBpm=92,tapTimes=[];
const INTENSITY_RANGES={low:{min:14,max:32},mid:{min:36,max:62},high:{min:62,max:92}};
const MAIN=[['drive','Saturation'],['bitcrush','Resampler'],['tapesat','Tape'],['chorus','Chorus'],['tremolo','Tremolo'],['reverse','Reverse'],['delay','Delay'],['reverb','Reverb']];
const EXTRA=[['filter','Filter'],['wowflutter','Wow/Flutter'],['vinyl','Vinyl'],['phaser','Phaser'],['widener','Stereo Wide'],['sidechain','Sidechain']];
const PEDAL_DEFS=MAIN.concat(EXTRA,[['drift','Drift'],['unstable','Unstable']]).map(a=>({key:a[0],name:a[1]}));
const modelPick={},pedalIntensity={};PEDAL_DEFS.forEach(d=>pedalIntensity[d.key]='mid');
const selectedEffects=new Set(['drive','chorus']);
const knob={drift:0,unstable:0},knobSet={};
let focusKey='drive',currentVibe='free';
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx}
function status(t){$('st').textContent=t}
// ---------- DSP: Pedal-Pipeline (Reihenfolge = Signalweg) ----------
function stage(buf,extra,build){const sr=buf.sampleRate,oc=new OfflineAudioContext(buf.numberOfChannels,buf.length+Math.floor(extra*sr),sr),src=oc.createBufferSource();src.buffer=buf;const end=build(oc,src);end.connect(oc.destination);src.start(0);return oc.startRendering()}
function newBuf(b,extra){return getAudioCtx().createBuffer(b.numberOfChannels,b.length+Math.floor((extra||0)*b.sampleRate),b.sampleRate)}
function curve(k,bias){const n=4096,c=new Float32Array(n),m=Math.abs(Math.tanh(k+bias)-Math.tanh(bias))||1;for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(Math.tanh(k*x+bias)-Math.tanh(bias))/m}return c}
function rnd(rate){const n=Math.ceil(900*rate)+4,p=[];for(let i=0;i<n;i++)p.push(Math.random()*2-1);return t=>{const x=t*rate,i=Math.floor(x),f=x-i,e=f*f*(3-2*f);return p[i%n]*(1-e)+p[(i+1)%n]*e}}
function modDelay(b,dfn){const sr=b.sampleRate,L=b.length,o=newBuf(b);for(let c=0;c<b.numberOfChannels;c++){const s=b.getChannelData(c),d=o.getChannelData(c);for(let i=0;i<L;i++){const rp=i-dfn(i/sr)*sr,i0=Math.floor(rp),f=rp-i0,x=(i0>=0&&i0<L)?s[i0]:0,y=(i0+1>=0&&i0+1<L)?s[i0+1]:0;d[i]=x+(y-x)*f}}return o}
function peakNorm(b){let m=0;for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=0;i<d.length;i++){const v=Math.abs(d[i]);if(v>m)m=v}}if(m>.95){const g=.95/m;for(let c=0;c<b.numberOfChannels;c++){const d=b.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=g}}return b}
function lp(oc,f,q){const n=oc.createBiquadFilter();n.type='lowpass';n.frequency.value=f;n.Q.value=q||.7;return n}
const PEDALS={
 drive:(b,a,v)=>stage(b,0,(oc,s)=>{const pre=oc.createGain();pre.gain.value=1+a*3;const sh=oc.createWaveShaper();sh.curve=curve(1+a*14,.06*v);sh.oversample='4x';const po=oc.createGain();po.gain.value=.9/(1+a*.8);s.connect(pre);pre.connect(sh);sh.connect(po);return po}),
 tapesat:async(b,a,v)=>{const r=await stage(b,0,(oc,s)=>{const pre=oc.createGain();pre.gain.value=1+a*1.6;const sh=oc.createWaveShaper();sh.curve=curve(.6+a*3,.18);sh.oversample='4x';const bump=oc.createBiquadFilter();bump.type='lowshelf';bump.frequency.value=90;bump.gain.value=a*3.5;const f=lp(oc,13000-a*7500);const po=oc.createGain();po.gain.value=.9/(1+a*.5);s.connect(pre);pre.connect(sh);sh.connect(bump);bump.connect(f);f.connect(po);return po});const w=rnd(.9);return modDelay(r,t=>a*.0009*(1+w(t))+a*.0002*Math.sin(6.283*5.5*t))},
 bitcrush:(b,a,v)=>{const q=Math.pow(2,Math.round(14-a*(5+v*3))-1),f=1+Math.round(a*(3+v*4)),k=f===1?1:Math.max(.15,1.6/(f+1.2)),o=newBuf(b);for(let c=0;c<b.numberOfChannels;c++){const s=b.getChannelData(c),d=o.getChannelData(c);let h=0,y=0;for(let i=0;i<s.length;i++){if(i%f===0)h=Math.round(s[i]*q)/q;y+=(h-y)*k;d[i]=y}}return o},
 chorus:(b,a,v)=>stage(b,0,(oc,s)=>{const dl=oc.createDelay(.05);dl.delayTime.value=.012+v*.014;const l=oc.createOscillator();l.frequency.value=.4+v*2.2+a*.6;const lg=oc.createGain();lg.gain.value=.003+a*.007;l.connect(lg);lg.connect(dl.delayTime);l.start(0);const w=oc.createGain();w.gain.value=Math.min(.55,.2+a*.4);const m=oc.createGain();s.connect(m);s.connect(dl);dl.connect(w);w.connect(m);return m}),
 tremolo:(b,a,v)=>stage(b,0,(oc,s)=>{const g=oc.createGain();g.gain.value=1-a*.5;const l=oc.createOscillator();l.frequency.value=currentBpm/60*[.5,1,2,3][Math.floor(v*4)%4];const d=oc.createGain();d.gain.value=a*.5;l.connect(d);d.connect(g.gain);l.start(0);s.connect(g);return g}),
 reverse:(b,a,v)=>{const sr=b.sampleRate,seg=Math.floor(sr*60/currentBpm*(v<.5?1:2)),o=newBuf(b,seg/sr),g=.35+a*.55,fd=Math.floor(sr*.008);for(let c=0;c<b.numberOfChannels;c++){const s=b.getChannelData(c),d=o.getChannelData(c);d.set(s);for(let st=0;st<s.length;st+=seg){const n=Math.min(seg,s.length-st);for(let k=0;k<n;k++){const e=Math.min(1,k/fd,(n-k)/fd);const j=st+seg+k;if(j<d.length)d[j]+=s[st+n-1-k]*g*e}}}return o},
 delay:(b,a,v)=>stage(b,2.5,(oc,s)=>{const dl=oc.createDelay(1.5);dl.delayTime.value=Math.max(.06,Math.min(1,60/currentBpm*[.25,.375,.5,.667][Math.floor(v*4)%4]));const fb=oc.createGain();fb.gain.value=.15+a*.5;const f=lp(oc,4200-a*2000);const w=oc.createGain();w.gain.value=.25+a*.35;const m=oc.createGain();s.connect(m);s.connect(dl);dl.connect(f);f.connect(fb);fb.connect(dl);f.connect(w);w.connect(m);return m}),
 reverb:(b,a,v)=>stage(b,3,(oc,s)=>{const cv=oc.createConvolver(),sr=oc.sampleRate,L=Math.floor(sr*(.8+v*2.2)),ir=oc.createBuffer(2,L,sr);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,1.5+v*2)}cv.buffer=ir;const f=lp(oc,7500-a*3000);const w=oc.createGain();w.gain.value=.15+a*.5;const m=oc.createGain();s.connect(m);s.connect(cv);cv.connect(f);f.connect(w);w.connect(m);return m}),
 filter:(b,a)=>stage(b,0,(oc,s)=>{const f=lp(oc,9000-a*7500);s.connect(f);return f}),
 wowflutter:(b,a,v)=>{const r=.3+(1-v)*1.2,fr=5+v*12,m=.3+(1-v)*.5,A=.008*(.3+a)/2;return modDelay(b,t=>A*(1+Math.sin(6.283*r*t)*m+Math.sin(6.283*fr*t)*(1-m)))},
 vinyl:(b,a)=>{const o=newBuf(b);for(let c=0;c<b.numberOfChannels;c++){const s=b.getChannelData(c),d=o.getChannelData(c);for(let i=0;i<s.length;i++){const cr=Math.random()<.0025*a?(Math.random()*2-1)*.35*a:0;d[i]=s[i]*(1-.05*a)+cr+(Math.random()*2-1)*.02*a}}return o},
 phaser:(b,a,v)=>stage(b,0,(oc,s)=>{const l=oc.createOscillator();l.frequency.value=.1+v*.6+a*.3;const lg=oc.createGain();lg.gain.value=700+a*1300;const off=oc.createConstantSource();off.offset.value=800+v*900;l.connect(lg);l.start(0);off.start(0);let p=s;for(let i=0;i<4;i++){const ap=oc.createBiquadFilter();ap.type='allpass';ap.Q.value=1.2;lg.connect(ap.frequency);off.connect(ap.frequency);p.connect(ap);p=ap}const w=oc.createGain();w.gain.value=Math.min(.6,a*.65);const m=oc.createGain();s.connect(m);p.connect(w);w.connect(m);return m}),
 widener:(b,a)=>{if(b.numberOfChannels<2)return b;const o=newBuf(b),L=b.getChannelData(0),R=b.getChannelData(1),l=o.getChannelData(0),r=o.getChannelData(1),w=1+a*1.2;for(let i=0;i<L.length;i++){const m=(L[i]+R[i])*.5,sd=(L[i]-R[i])*.5*w;l[i]=m+sd;r[i]=m-sd}return o},
 sidechain:(b,a)=>stage(b,0,(oc,s)=>{const g=oc.createGain(),bt=60/currentBpm,dp=.15+a*.65;g.gain.setValueAtTime(1,0);for(let k=0;k*bt<b.duration+bt;k++){const t=k*bt;g.gain.setValueAtTime(1,t);g.gain.linearRampToValueAtTime(1-dp,t+bt*.08);g.gain.linearRampToValueAtTime(1,t+bt*.85)}s.connect(g);return g})
};
// ---------- Pedal-Modelle (Variante = Pedaltyp) ----------
const PEDAL_MODELS={drive:['Warm','Tube','Overdrive','Fuzz'],bitcrush:['SP-12 12-bit','Cassette 8-bit','Varispeed ↓','Varispeed ↑'],tapesat:['Cassette','Reel-to-Reel'],chorus:['CE-1 Chorus','Vibrato','Ensemble','Flanger'],tremolo:['Opto','Harmonic','Slicer'],reverse:['Reverse ½','Reverse 1','Reverse 2'],delay:['BBD Analog','Tape Echo','Ping-Pong'],reverb:['Spring','Plate','Hall','Cathedral']};
const mi=(k,v)=>Math.floor(v*PEDAL_MODELS[k].length)%PEDAL_MODELS[k].length;
const hp=(oc,f)=>{const n=oc.createBiquadFilter();n.type='highpass';n.frequency.value=f;n.Q.value=.7;return n};
const gn=(oc,v)=>{const n=oc.createGain();n.gain.value=v;return n};
const sh=(oc,c)=>{const n=oc.createWaveShaper();n.curve=c;n.oversample='4x';return n};
const shelf=(oc,f,g)=>{const n=oc.createBiquadFilter();n.type='lowshelf';n.frequency.value=f;n.gain.value=g;return n};
const comp=oc=>{const c=oc.createDynamicsCompressor();c.threshold.value=-22;c.knee.value=12;c.ratio.value=4;c.attack.value=.006;c.release.value=.2;return c};
function seq(s,l){let p=s;l.forEach(n=>{p.connect(n);p=n});return p}
function wd(oc,s,e,w,d){const m=oc.createGain(),a=gn(oc,d),b=gn(oc,w);s.connect(a);a.connect(m);e.connect(b);b.connect(m);return m}
function mkCurve(f){const n=4096,c=new Float32Array(n);for(let i=0;i<n;i++)c[i]=f(i*2/n-1);return c}
const clipC=(k,as)=>mkCurve(x=>x>=0?1-Math.exp(-k*x):-(1-Math.exp(as*k*x))*.9),rectC=()=>mkCurve(x=>Math.min(1,Math.abs(x)*1.6+x*.3));
const SAT=[
 (oc,a)=>[gn(oc,1+a*3.5),sh(oc,curve(1.1+a*2.2,.28)),shelf(oc,180,a*2.5),lp(oc,10500-a*4500),gn(oc,.45)],
 (oc,a)=>[hp(oc,60),gn(oc,1+a*6),sh(oc,curve(1.6+a*3,.4)),shelf(oc,140,a*2),lp(oc,8000-a*3000),gn(oc,.4)],
 (oc,a)=>[hp(oc,720),gn(oc,1+a*14),sh(oc,curve(1.4,0)),lp(oc,3800),gn(oc,.7)],
 (oc,a)=>[gn(oc,2+a*30),sh(oc,clipC(3,.8)),hp(oc,180),gn(oc,3),sh(oc,clipC(3,.9)),lp(oc,2600),gn(oc,.5)]];

function bufferToWav(buffer) {
    const numChannels = buffer.numberOfChannels;
    const sampleRate = buffer.sampleRate;
    const numFrames = buffer.length;
    const bytesPerSample = 2;
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = numFrames * blockAlign;
    const bufferSize = 44 + dataSize;

    const arrayBuffer = new ArrayBuffer(bufferSize);
    const view = new DataView(arrayBuffer);

    function writeString(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeString(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bytesPerSample * 8, true);
    writeString(36, 'data');
    view.setUint32(40, dataSize, true);

    const channelData = [];
    for (let ch = 0; ch < numChannels; ch++) channelData.push(buffer.getChannelData(ch));

    let offset = 44;
    for (let i = 0; i < numFrames; i++) {
      for (let ch = 0; ch < numChannels; ch++) {
        let sample = Math.max(-1, Math.min(1, channelData[ch][i]));
        sample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
        view.setInt16(offset, sample, true);
        offset += 2;
      }
    }

    return new Blob([arrayBuffer], { type: 'audio/wav' });
  }
