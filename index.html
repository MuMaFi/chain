<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>chain.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --line: #000000;
    --text: #000000;
    --sub: #666666;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Mono',monospace;
    min-height:100vh;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{ max-width:520px; width:100%; margin:0 auto; }

  header{ text-align:center; margin-bottom:40px; }
  header h1{
    font-weight:600;
    font-size:clamp(28px,7vw,44px);
    letter-spacing:1px;
    margin:0;
    color:var(--text);
    text-transform:lowercase;
  }
  header p{
    margin:8px 0 0;
    color:var(--sub);
    font-size:12px;
    letter-spacing:.5px;
    font-weight:400;
  }

  .tools{ display:flex; flex-direction:column; gap:14px; }
  .tool-link{
    display:block;
    background:#ffffff;
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 22px;
    text-decoration:none;
    color:var(--text);
    transition:background .15s ease, transform .08s ease;
  }
  .tool-link:hover{ background:#f5f5f5; transform:translateY(-2px); }
  .tool-link:active{ transform:translateY(0); }
  .tool-name{
    font-size:18px;
    font-weight:600;
    letter-spacing:.5px;
    text-transform:lowercase;
    margin:0 0 4px;
  }
  .tool-desc{
    font-size:11px;
    color:var(--sub);
    letter-spacing:.3px;
    margin:0;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>chain<span>.</span></h1>
    <p>browser-based audio tools</p>
  </header>

  <div class="tools">
    <a class="tool-link" href="https://mumafi.github.io/signal-mastering/">
      <p class="tool-name">signal.</p>
      <p class="tool-desc">mastering</p>
    </a>

    <a class="tool-link" href="https://mumafi.github.io/tape-reflex/">
      <p class="tool-name">tape-reflex.</p>
      <p class="tool-desc">fx tool</p>
    </a>
  </div>

</div>
</body>
</html>
